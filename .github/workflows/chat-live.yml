name: Live pilot chat
on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]
permissions: {}
jobs:
  hello:
    if: github.event_name == 'workflow_dispatch' || ((github.event.label.name == 'verify-pilot-chat' || contains(github.event.pull_request.labels.*.name, 'verify-pilot-chat')) && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send one synthetic message through the same public endpoint as the iPhone
        shell: python
        run: |
          import json
          import re
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          payload = json.dumps({"message": "Привет!", "history": []}).encode()
          request = Request("https://eto-ty-pilot-chat.sacredarbor.chatgpt.site/v1/chat", data=payload,
                            headers={"Content-Type": "application/json", "Accept": "application/json",
                                     "User-Agent": "EtoTy/1.0", "Origin": "https://eto-ty-pilot-chat.sacredarbor.chatgpt.site"})
          try:
              with urlopen(request, timeout=35) as response:
                  assert response.status == 200
                  reply = json.load(response)["reply"]
                  assert isinstance(reply, str) and 0 < len(reply.strip()) <= 4000
                  print("Synthetic greeting received an assistant reply; characters:", len(reply))
          except HTTPError as error:
              body = error.read(8192).decode(errors="replace")
              print("Service HTTP status:", error.code, "content type:", error.headers.get_content_type(), "server:", error.headers.get("Server"))
              print("Response:", re.sub("<[^>]+>", " ", body)[:800])
              raise
