name: Pilot checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  iphone:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: make check
      - run: make ios-build
      - run: make ios-smoke
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse iPhone app and UI-test sources
        run: swiftc -frontend -parse ios/EtoTy/*.swift ios/EtoTyUITests/*.swift
      - name: Test source confirmation, body map and visit selection
        run: sh tests/portable/check.sh
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: make db-check
