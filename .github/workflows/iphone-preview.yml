name: iPhone preview
on:
  push:
    branches: [preview/iphone-2a0be1f1-screens]
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Capture the three tabs in a fresh simulator
        shell: bash
        run: |
          set -euo pipefail
          # The installed app comes from the selected revision. Only the UI test driver changes.
          cat > ios/EtoTyUITests/CareJourneyUITests.swift <<'SWIFT'
          import XCTest
          final class CareJourneyUITests: XCTestCase {
              @MainActor func testPersonalConversationSurvivesRelaunch() {
                  continueAfterFailure = false
                  let app = XCUIApplication()
                  app.launch()
                  let tabs = [("Диалог", "01-dialog"), ("Мой уровень", "02-level"), ("Карта тела", "03-map")]
                  for (title, filename) in tabs {
                      let tab = app.tabBars.buttons[title]
                      XCTAssertTrue(tab.waitForExistence(timeout: 30))
                      tab.tap()
                      XCTAssertTrue(tab.isSelected)
                      let frame = XCTAttachment(screenshot: app.screenshot())
                      frame.name = filename
                      frame.lifetime = .keepAlways
                      add(frame)
                  }
              }
          }
          SWIFT
          make ios-smoke
          bundle=$(find local-data/ios-smoke -name Journey.xcresult -print -quit)
          xcrun xcresulttool export attachments --path "$bundle" --output-path "$RUNNER_TEMP/frames"
          mkdir -p preview
          python3 - <<'PY'
          import os,json,subprocess
          from pathlib import Path
          folder=Path(os.environ["RUNNER_TEMP"])/"frames"
          manifest=json.loads((folder/"manifest.json").read_text())
          for item in manifest:
              for a in item["attachments"]:
                  name=a.get("suggestedHumanReadableName","")
                  for screen in ["01-dialog","02-level","03-map"]:
                      if screen in name:
                          subprocess.run(["sips","-s","format","png","-Z","950",str(folder/a["exportedFileName"]), "--out",f"preview/{screen}.png"],check=True)
          assert len(list(Path("preview").glob("*.png")))==3, manifest
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iphone-preview
          path: preview/*.png
          retention-days: 7
